<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: a control-room shell. Sticky header + tab strip, then one stage. In-game: timeline rail left, event stage right, action bar docked below. */
:root {
  --bg: #eceef1; --surface: #ffffff; --surface2: #e3e6ea; --sunken: #f4f5f7;
  --ink: #13171d; --ink2: #4b5563; --ink3: #6b7585;
  --line: #d4d9e0; --line2: #c0c7d1;
  --accent: #9c5b00; --accent-ink: #ffffff; --accent-soft: #f6e9d3;
  --danger: #b42318; --danger-soft: #fbe7e4; --ok: #17744a; --ok-soft: #dff3e8;
  --nl: 33%; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px; --rs: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --surface: #181c23; --surface2: #222731; --sunken: #13161b;
    --ink: #e9ecf1; --ink2: #a7b0be; --ink3: #8892a1;
    --line: #2a303b; --line2: #394150;
    --accent: #f0b04a; --accent-ink: #1b1204; --accent-soft: #33260f;
    --danger: #ff8a7e; --danger-soft: #3a1b18; --ok: #62d49d; --ok-soft: #12301f;
    --nl: 72%; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #181c23; --surface2: #222731; --sunken: #13161b;
  --ink: #e9ecf1; --ink2: #a7b0be; --ink3: #8892a1;
  --line: #2a303b; --line2: #394150;
  --accent: #f0b04a; --accent-ink: #1b1204; --accent-soft: #33260f;
  --danger: #ff8a7e; --danger-soft: #3a1b18; --ok: #62d49d; --ok-soft: #12301f;
  --nl: 72%; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink3); }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- shell ---------- */
.shell { max-width: 1200px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 0 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.bar { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.brand .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 17px; }
.season-name { color: var(--ink3); font: 500 13px var(--f-mono); max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; margin-top: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--ink2); cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; display: flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); display: inline-block; }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
main { flex: 1; padding: 20px 0 40px; min-width: 0; }

/* ---------- controls ---------- */
.btn { appearance: none; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); border-radius: var(--rs); padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; min-height: 38px; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line2)); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface2); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.btn.lg { min-height: 48px; padding: 10px 22px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 36px; padding: 0; }
.field { display: grid; gap: 4px; }
.field > label, .lbl { font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
input[type=text], input[type=number], input[type=search], select, textarea { background: var(--surface); border: 1px solid var(--line2); border-radius: var(--rs); padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 84px; font-family: var(--f-mono); font-size: 13px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 28px; }
.switch { display: inline-flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 500; }
.switch input { appearance: none; width: 40px; height: 22px; border-radius: 11px; background: var(--line2); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 99px; padding: 3px 10px; font: 500 12px var(--f-mono); background: var(--surface); color: var(--ink2); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip.red { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.chip.green { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip { cursor: pointer; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.card.flat { background: var(--sunken); }
.hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.hd h2 { font-size: 34px; }
.hd .sub { color: var(--ink2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.hint { color: var(--ink2); font-size: 13px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- avatars & names ---------- */
.av { --s: 64px; width: var(--s); height: var(--s); border-radius: 8px; overflow: hidden; position: relative; flex: none; background: hsl(var(--h, 210) calc(var(--sat, 100%) * .35) 30%); border: 2px solid var(--c, hsl(var(--h, 210) 60% 52%)); display: grid; place-items: center; color: #fff; font: 800 calc(var(--s) * .46) var(--f-display); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.gray img, .av.gray { filter: grayscale(1) contrast(.9); }
.av.gray { border-color: var(--line2); }
.av.dead::after { content: ""; position: absolute; inset: auto 0 0; height: 5px; background: var(--danger); }
.nm { color: hsl(var(--h, 210) calc(var(--sat, 100%) * .62) var(--nl)); font-weight: 800; }
.nm.dead { color: var(--danger); }
.nm .sr { font-weight: 400; }

/* ---------- game ---------- */
.game { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 112px; max-height: calc(100vh - 220px); overflow: auto; border-left: 2px solid var(--line); padding: 2px 0 2px 0; }
.rail button { all: unset; display: flex; gap: 10px; align-items: center; width: 100%; box-sizing: border-box; padding: 6px 12px; cursor: pointer; color: var(--ink2); font-size: 13px; border-left: 2px solid transparent; margin-left: -2px; }
.rail button:hover { background: var(--surface2); color: var(--ink); }
.rail button[aria-current="true"] { color: var(--ink); font-weight: 700; border-left-color: var(--accent); background: var(--surface); }
.rail button.future { opacity: .35; cursor: default; }
.rail .gap { height: 8px; }
.rail .n { font: 500 11px var(--f-mono); color: var(--ink3); width: 22px; }
.stage { min-width: 0; }
.ph-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
.ph-head h2 { font-size: clamp(46px, 9vw, 92px); line-height: .9; letter-spacing: .01em; }
.ph-head .meta { margin-left: auto; text-align: right; font: 500 13px var(--f-mono); color: var(--ink2); }
.ph-head .meta b { font: 800 40px var(--f-display); color: var(--ink); display: block; line-height: 1; }
.ph-intro { color: var(--ink2); font-size: 17px; margin-bottom: 18px; max-width: 62ch; }
.events { display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ev .faces { display: flex; gap: 6px; flex-wrap: wrap; max-width: 280px; }
.ev .txt { font-size: 16px; text-wrap: pretty; }
.ev.fatal { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.grid-av { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 12px; }
.pcard { display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 13px; min-width: 0; }
.pcard .av { --s: 96px; }
.pcard .t { font-weight: 600; max-width: 100%; overflow-wrap: anywhere; line-height: 1.2; }
.pcard .s { font: 500 11px var(--f-mono); color: var(--ink3); }
.pcard .s.alive { color: var(--ok); }
.dist-block { margin-bottom: 20px; }
.dist-block h3 { font-size: 22px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.dist-block h3::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: hsl(var(--h) 60% 52%); }
.dist-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.winner-box { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; padding: 18px 0; }
.winner-box .pcard .av { --s: 190px; border-width: 3px; }
.winner-box .pcard .t { font-size: 22px; }
.big-line { text-align: center; font: 700 clamp(22px, 4vw, 34px) var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 8px 0 4px; text-wrap: balance; }
.place-badge { font: 600 11px var(--f-mono); color: var(--ink); }
.pcard.p1 .av { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.actionbar { position: sticky; bottom: 0; z-index: 15; margin-top: 22px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.actionbar .inner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); }
.progress { flex: 1 1 140px; min-width: 100px; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.count { font: 600 22px var(--f-mono); letter-spacing: .02em; }
.cdwn { display: flex; align-items: center; gap: 10px; }
.mobile-rail { display: none; }

/* ---------- editors ---------- */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 14px; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dcard > header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--sunken); border-bottom: 1px solid var(--line); border-top: 4px solid hsl(var(--h) 60% 52%); }
.dcard > header h3 { font-size: 19px; flex: 1; }
.trow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 92px 30px; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .av { --s: 48px; cursor: pointer; }
.trow .av:hover::before { content: "↑"; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.5); font-size: 20px; }
.trow .names { display: grid; gap: 4px; min-width: 0; }
.trow input, .trow select { min-height: 32px; padding: 4px 8px; font-size: 14px; }
.drop-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
.ev-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: start; }
.ev-item:last-child { border-bottom: 0; }
.ev-item .p { font-size: 14px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.relrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 140px auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.relrow:last-child { border-bottom: 0; }
.relrow .av { --s: 36px; }
.lvl-enemy { color: var(--danger); } .lvl-rival { color: #b45f06; } .lvl-friend, .lvl-ally { color: var(--ok); } .lvl-couple { color: #c026d3; }
.slider-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center; }
.slider-row .val { font: 700 22px var(--f-mono); text-align: right; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.table th { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); }
.cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: r; }
.rank li { display: flex; gap: 10px; font-size: 14px; align-items: baseline; }
.rank li > .k { font: 500 12px var(--f-mono); color: var(--ink3); width: 36px; text-align: right; flex: none; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 4px; font: 500 12px var(--f-mono); white-space: nowrap; transform: translate(-50%, -120%); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: 90vw; }
.modal-bg { position: fixed; inset: 0; background: rgba(8,10,14,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r); padding: 18px; width: min(640px, 100%); max-height: 88vh; overflow: auto; display: grid; gap: 12px; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink2); }
.code { font: 800 56px var(--f-display); letter-spacing: .18em; padding-left: .18em; }
.peers { display: grid; gap: 6px; }
.peer { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rs); }
.peer .nm2 { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lobby-hero { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 28px 12px; }

@media (max-width: 860px) {
  .game { grid-template-columns: 1fr; gap: 12px; }
  .rail { display: none; }
  .mobile-rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .mobile-rail::-webkit-scrollbar { display: none; }
  .mobile-rail button { flex: none; }
  .ev { grid-template-columns: 1fr; }
  .ev .faces { max-width: none; }
  .season-name { display: none; }
  .relrow { grid-template-columns: 36px minmax(0, 1fr) 120px; }
  .relrow .opt { grid-column: 2 / -1; }
  .dgrid { grid-template-columns: 1fr; }
  .winner-box .pcard .av { --s: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.gamechip { display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 3px 10px 3px 4px; border: 1px solid var(--line2); border-radius: 999px; background: var(--surface); }
.gamechip:not(:has(img)) { padding-left: 10px; }
.gamechip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
.dcard > header input.dname { flex: 1; min-width: 0; font: 800 19px var(--f-display); text-transform: uppercase; letter-spacing: .02em; background: transparent; border-color: transparent; padding: 2px 6px; min-height: 32px; }
.dcard > header input.dname:hover, .dcard > header input.dname:focus { background: var(--surface); border-color: var(--line2); }

.ph-head .meta b { font-variant-numeric: tabular-nums; transition: color .2s; transform-origin: right center; }
.ph-head .meta b.counting { color: var(--danger); }
.ph-head .meta b.pop { animation: tickpop .28s ease-out; }
@keyframes tickpop { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .ph-head .meta b.pop { animation: none; } }

.dist-block h3::before { background: var(--c, hsl(var(--h) 60% 52%)); }
.dcard > header { border-top-color: var(--c, hsl(var(--h) 60% 52%)); }
.colorpick { position: relative; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); display: grid; place-items: center; padding: 0; cursor: pointer; flex: none; }
.colorpick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.colorpick i { width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(0,0,0,.25); display: block; }
.colorpick.unset i { background: repeating-linear-gradient(45deg, var(--surface2) 0 4px, var(--surface) 4px 8px) !important; }
.colorcell { display: flex; align-items: center; gap: 2px; }

/* chat */
.chat { position: fixed; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.chat-fab { position: relative; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); font: 600 14px var(--f-body); padding: 10px 14px; border-radius: 999px; box-shadow: var(--shadow); cursor: pointer; }
.chat-fab:hover { border-color: var(--accent); }
.chat-badge { position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 12px/20px var(--f-body); text-align: center; }
.chat-panel { display: none; flex-direction: column; width: min(340px, calc(100vw - 24px)); height: min(420px, 60vh); background: var(--surface); border: 1px solid var(--line2); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.chat[data-open="1"] .chat-panel { display: flex; }
.chat-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
.chat-list { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.chat-msg { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.chat-msg .who { font-weight: 700; margin-right: 6px; }
.chat-msg.mine .who { opacity: .85; }
.chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
